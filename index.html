<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Coach CSEC</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f8fa;color:#0f172a;margin:0;line-height:1.5}
#app{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.appbar{position:sticky;top:0;z-index:20;background:#0f766e;color:#fff;margin:-16px -16px 16px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.appbar h1{font-size:16px;margin:0;font-weight:600;flex:1}
.appbar button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e2e8f0}
.card h2{margin:0 0 6px;font-size:17px}
.card p{margin:6px 0;color:#64748b;font-size:14px}
button.btn{background:#0f766e;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
button.btn.secondary{background:#e2e8f0;color:#0f172a}
button.btn.ghost{background:transparent;color:#0f766e;border:1px solid #0f766e}
button.btn.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid.two{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
.progress-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.progress-bar>div{height:100%;background:#0f766e;transition:width .3s}
.opt{display:block;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff;font-size:14px}
.opt.correct{border-color:#16a34a;background:#f0fdf4}
.opt.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px}
.feedback.correct{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.feedback.wrong{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px}
textarea{min-height:90px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center}
.kpi .num{font-size:20px;font-weight:700;color:#0f766e}
.kpi .lbl{font-size:11px;color:#64748b;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e2e8f0}
.hidden{display:none}
.keyterm{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
.keyterm b{min-width:110px;color:#115e59}
.diagram{background:#f8fafc;border:1px dashed #e2e8f0;border-radius:10px;padding:10px;text-align:center;font-size:12px;color:#64748b;margin:8px 0}
.callout{border-left:3px solid #0f766e;background:#f0fdfa;padding:10px 12px;border-radius:8px;font-size:13.5px;margin:8px 0}
.callout.warn{border-left-color:#ea580c;background:#fff7ed}
.callout.info{border-left-color:#0284c7;background:#eff6ff}
.footer{text-align:center;color:#64748b;font-size:12px;margin-top:24px}
</style>
</head>

// ================== STATE ==================
const KEY = "itcoach_v3";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function defaultState(){return{student:null,progress:{},quizzes:{},teacherMode:false,view:{name:"home",params:{}}}}
let state = (()=>{try{const r=localStorage.getItem(KEY);return r?{...defaultState(),...JSON.parse(r)}:defaultState()}catch{return defaultState()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}

// ================== HELPERS ==================
const getTopic = id => COURSE.topics.find(t=>t.id===+id);
const getLesson = (tid,lid) => getTopic(tid)?.lessons.find(l=>l.id===lid);
function topicProgress(id){
  const t=getTopic(id);
  const done=t.lessons.filter(l=>state.progress[l.id]).length;
  return{done,total:t.lessons.length,pct:Math.round(100*done/t.lessons.length)};
}
function overallProgress(){
  let d=0,n=0;
  COURSE.topics.forEach(t=>{const p=topicProgress(t.id);d+=p.done;n+=p.total});
  return{done:d,total:n,pct:n?Math.round(100*d/n):0};
}
function renderBlock(b){
  switch(b.type){
    case "h3": return `<h3 style="margin:14px 0 4px;font-size:15px;color:#115e59">${esc(b.text)}</h3>`;
    case "p": return `<p>${esc(b.text)}</p>`;
    case "list": return `<ul style="margin:6px 0 6px 18px;padding:0">${b.items.map(i=>`<li style="margin:4px 0;font-size:14px">${esc(i)}</li>`).join("")}</ul>`;
    case "diagram": return `<div class="diagram">📊 ${esc(b.label)}</div>`;
    case "callout": {
      const cls = b.variant==="warn"?"callout warn":b.variant==="info"?"callout info":"callout";
      return `<div class="${cls}">${esc(b.text)}</div>`;
    }
    case "table": return `<div style="overflow-x:auto;margin:8px 0"><table><thead><tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    default: return "";
  }
}
