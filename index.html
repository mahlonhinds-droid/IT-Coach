<style>
  :root{--bg:#f6f8fa;--card:#fff;--primary:#0f766e;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--correct:#16a34a;--wrong:#dc2626;--warn:#ea580c;--radius:12px}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5}
  #app{max-width:760px;margin:0 auto;padding:16px 16px 80px}
  .appbar{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;margin:-16px -16px 16px;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .appbar h1{font-size:16px;margin:0;font-weight:600;flex:1}
  .appbar button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
  .card h2{margin:0 0 6px;font-size:17px}
  .card p{margin:6px 0;color:var(--muted);font-size:14px}
  button.btn{background:var(--primary);color:#fff;border:0;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  button.btn.secondary{background:#e2e8f0;color:var(--text)}
  button.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  button.btn.small{padding:6px 10px;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid.two{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
  .progress-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
  .progress-bar>div{height:100%;background:var(--primary);transition:width .3s}
  .opt{display:block;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:#fff;font-size:14px}
  .opt.correct{border-color:var(--correct);background:#f0fdf4}
  .opt.wrong{border-color:var(--wrong);background:#fef2f2}
  .feedback{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px}
  .feedback.correct{background:#f0fdf4;color:#166534;border:1px solid #86efac}
  .feedback.wrong{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
  textarea,input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px}
  textarea{min-height:80px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
  .kpi .num{font-size:20px;font-weight:700;color:var(--primary)}
  .kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  .hidden{display:none}
  .lesson-diagram{background:#f8fafc;border:1px dashed var(--border);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--muted);margin:8px 0}
  .keyterm{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .keyterm b{min-width:110px;color:#115e59}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>

    { q:"Which is a valid Pascal variable name?", opts:["2ndMark","Mark_2","my mark","end"], correct:1 },
    { q:"Which program translates the whole source program before it runs?", opts:["Compiler","Interpreter","Browser","Editor"], correct:0 },
    { q:"Which statement declares an array of 10 integers?", opts:["var A: array[1..10] of integer;","var A: integer[10];","array A = 10;","A := array 10;"], correct:0 },
    { q:"Meaningful variable names and comments in the code are", opts:["internal documentation","external documentation","test data","object code"], correct:0 },
    { q:"How many times does the loop for i = 2 to 6 do run?", opts:["4","5","6","7"], correct:1 }
  ]}
};/* ============ STATE ============ */
const DEFAULT_STATE = () => ({
  student: null,
  progress: {},
  quizResults: {},
  teacherMode: false,
  view: { name: "home", params: {} }
});

let state = loadLocal();

function loadLocal() {
  try {
    const raw = localStorage.getItem("itcoach_v2");
    return raw ? { ...DEFAULT_STATE(), ...JSON.parse(raw) } : DEFAULT_STATE();
  } catch { return DEFAULT_STATE(); }
}
function saveLocal() {
  try { localStorage.setItem("itcoach_v2", JSON.stringify(state)); } catch {}
}

/* ============ SUPABASE SYNC ============ */
async function pushProgress(lessonId) {
  if (!state.student?.name) return;
  try {
    const { data: existing } = await supabase
      .from("student_progress")
      .select("id")
      .eq("student_name", state.student.name)
      .eq("lesson_id", lessonId)
      .maybeSingle();

    const row = {
      student_name: state.student.name,
      student_class: state.student.klass || "",
      lesson_id: lessonId,
      progress: state.progress,
      mcq_topic1: state.quizResults[1]?.mcq?.score ?? null,
      mcq_topic2: state.quizResults[2]?.mcq?.score ?? null,
      mcq_topic3: state.quizResults[3]?.mcq?.score ?? null,
      updated_at: new Date().toISOString()
    };

    if (existing?.id) {
      await supabase.from("student_progress").update(row).eq("id", existing.id);
    } else {
      await supabase.from("student_progress").insert(row);
    }
  } catch (e) {
    console.warn("Supabase sync failed — will retry on next action.", e);
  }
}

async function pushQuiz(topicId) {
  if (!state.student?.name) return;
  // Push a synthetic row so the dashboard sees the latest quiz result even if no lesson was just completed
  await pushProgress(`quiz-${topicId}`);
}

async function fetchAllProgress() {
  const { data, error } = await supabase
    .from("student_progress")
    .select("*")
    .order("updated_at", { ascending: false });
  if (error) { console.warn(error); return []; }
  // Aggregate latest row per student
  const byStudent = {};
  (data || []).forEach(r => {
    if (!byStudent[r.student_name]) {
      byStudent[r.student_name] = {
        name: r.student_name,
        klass: r.student_class,
        progress: r.progress || {},
        mcq1: r.mcq_topic1,
        mcq2: r.mcq_topic2,
        mcq3: r.mcq_topic3,
        updated: r.updated_at
      };
    } else {
      // Merge progress from older rows
      Object.assign(byStudent[r.student_name].progress, r.progress || {});
    }
  });
  return Object.values(byStudent);
}

/* ============ RENDER HELPERS ============ */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const getTopic = id => COURSE.topics.find(t => t.id === +id);
const getLesson = (tid, lid) => getTopic(tid)?.lessons.find(l => l.id === lid);

function topicProgress(topicId) {
  const t = getTopic(topicId);
  const total = t.lessons.length;
  const done = t.lessons.filter(l => state.progress[l.id]).length;
  return { done, total, pct: total ? Math.round(100 * done / total) : 0 };
}
function overallProgress() {
  let done = 0, total = 0;
  COURSE.topics.forEach(t => {
    const p = topicProgress(t.id);
    done += p.done; total += p.total;
  });
  return { done, total, pct: total ? Math.round(100 * done / total) : 0 };
}

function renderBlock(b) {
  switch (b.type) {
    case "h3": return `<h3 style="margin:14px 0 4px;font-size:15px;color:#115e59">${esc(b.text)}</h3>`;
    case "p": return `<p>${esc(b.text)}</p>`;
    case "list": return `<ul style="margin:6px 0 6px 18px;padding:0">${b.items.map(i => `<li style="margin:4px 0;font-size:14px">${esc(i)}</li>`).join("")}</ul>`;
    case "diagram": return `<div class="lesson-diagram">📊 ${esc(b.label)}</div>`;
    case "callout": {
      const colors = { tip:"#0f766e", info:"#0284c7", warn:"#ea580c" };
      const bg = { tip:"#f0fdfa", info:"#eff6ff", warn:"#fff7ed" };
      return `<div style="border-left:3px solid ${colors[b.variant]||colors.tip};background:${bg[b.variant]||bg.tip};padding:10px 12px;border-radius:8px;font-size:13.5px;margin:8px 0">${esc(b.text)}</div>`;
    }
    case "table": return `
      <div style="overflow-x:auto;margin:8px 0">
        <table><thead><tr>${b.headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
      </div>`;
    default: return "";
  }
}

let realtimeChannel = null;
function subscribeRealtime() {
  if (realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel = supabase
    .channel("progress-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "student_progress" }, () => {
      loadDashboard();
    })
    .subscribe(status => {
      const el = document.getElementById("live-status");
      if (el) el.textContent = status === "SUBSCRIBED" ? "Connected · updates appear instantly" : "Reconnecting…";
    });
}

async function loadDashboard() {
  const rows = await fetchAllProgress();
  const container = document.getElementById("dash-content");
  if (!container) return;

  const totalLessons = COURSE.topics.reduce((a, t) => a + t.lessons.length, 0);
  const enriched = rows.map(r => {
    const done = Object.keys(r.progress || {}).filter(k => r.progress[k]).length;
    return { ...r, progressPct: totalLessons ? Math.round(100 * done / totalLessons) : 0 };
  });

  const avgProgress = enriched.length ? Math.round(enriched.reduce((a, r) => a + r.progressPct, 0) / enriched.length) : 0;
  const withMcq = enriched.filter(r => r.mcq1 != null);
  const avgMcq = withMcq.length ? Math.round(withMcq.reduce((a, r) => a + r.mcq1, 0) / withMcq.length) : 0;

  container.innerHTML = `
    <div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="num">${enriched.length}</div><div class="lbl">Students</div></div>
      <div class="kpi"><div class="num">${avgProgress}%</div><div class="lbl">Avg progress</div></div>
      <div class="kpi"><div class="num">${avgMcq}%</div><div class="lbl">Avg MCQ T1</div></div>
      <div class="kpi"><div class="num">${COURSE.topics.length}</div><div class="lbl">Topics</div></div>
    </div>
    <div class="card">
      <h2>Student results</h2>
      ${enriched.length === 0 ? `<p class="muted">No students have synced yet. As soon as a student marks a lesson complete, their row will appear here.</p>` : `
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Student</th><th>Class</th><th>Progress</th><th>T1 MCQ</th><th>T2 MCQ</th><th>T3 MCQ</th><th>Updated</th></tr></thead>
          <tbody>
            ${enriched.map(r => `
              <tr>
                <td><b>${esc(r.name)}</b></td>
                <td>${esc(r.klass || "—")}</td>
                <td>${r.progressPct}%</td>
                <td>${fmt(r.mcq1)}</td>
                <td>${fmt(r.mcq2)}</td>
                <td>${fmt(r.mcq3)}</td>
                <td class="muted">${r.updated ? new Date(r.updated).toLocaleDateString() : "—"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>`}
    </div>
    <div class="card">
      <h2>Topic breakdown (class average)</h2>
      ${COURSE.topics.map(t => {
        const avg = enriched.length
          ? Math.round(enriched.reduce((a, r) => {
              const p = r.progress || {};
              const done = t.lessons.filter(l => p[l.id]).length;
              return a + Math.round(100 * done / t.lessons.length);
            }, 0) / enriched.length)
          : 0;
        return `
          <div style="margin:8px 0">
            <div class="row" style="justify-content:space-between">
              <span style="font-size:13.5px;font-weight:600">${t.icon} ${esc(t.title)}</span>
              <span class="muted">${avg}%</span>
            </div>
            <div class="progress-bar" style="margin-top:4px"><div style="width:${avg}%;background:${t.color}"></div></div>
          </div>`;
      }).join("")}
    </div>
    <div class="card">
      <button class="btn secondary" onclick="exportCSV()">Download CSV</button>
    </div>
  `;
}

function fmt(v) {
  if (v == null) return `<span class="muted">—</span>`;
  const pct = v * 10; // MCQ is out of 10 max — scale to %
  const color = v >= 4 ? "var(--correct)" : v >= 3 ? "var(--warn)" : "var(--wrong)";
  return `<span style="color:${color};font-weight:700">${v}</span>`;
}

async function exportCSV() {
  const rows = await fetchAllProgress();
  const totalLessons = COURSE.topics.reduce((a, t) => a + t.lessons.length, 0);
  const header = "Name,Class,Progress %,MCQ T1,MCQ T2,MCQ T3,Last Updated\n";
  const body = rows.map(r => {
    const done = Object.keys(r.progress || {}).filter(k => r.progress[k]).length;
    const pct = totalLessons ? Math.round(100 * done / totalLessons) : 0;
    return [
      `"${r.name}"`, `"${r.klass || ""}"`, pct,
      r.mcq1 ?? "", r.mcq2 ?? "", r.mcq3 ?? "",
      r.updated ? new Date(r.updated).toISOString() : ""
    ].join(",");
  }).join("\n");
  const blob = new Blob([header + body], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "it-coach-class.csv";
  a.click(); URL.revokeObjectURL(url);
}

/* ============ ACTIONS ============ */
function go(name, params = {}) {
  state.view = { name, params };
  saveLocal();
  window.scrollTo({ top: 0 });
  const views = {
    home: renderHome, topic: renderTopic, lesson: renderLesson,
    quiz: renderQuiz, teacher: renderTeacher, settings: renderSettings
  };
  (views[name] || renderHome)(params);
}

function toggleAnswer(id) {
  document.getElementById(id).classList.toggle("hidden");
}

function markLesson(lid, val) {
  state.progress[lid] = val;
  saveLocal();
  pushProgress(lid);
  go("lesson", { tid: +lid.split(".")[0], lid });
}

const mcqState = {};
function answerMCQ(qIdx, optIdx, correct) {
  const card = document.getElementById(`mcq-card-${qIdx}`);
  card.querySelectorAll(".opt").forEach(el => el.style.pointerEvents = "none");
  const chosen = document.getElementById(`opt-${qIdx}-${optIdx}`);
  const correctEl = document.getElementById(`opt-${qIdx}-${correct}`);
  const fb = document.getElementById(`fb-${qIdx}`);
  fb.classList.remove("hidden");
  if (optIdx === correct) {
    chosen.classList.add("correct");
    fb.className = "feedback correct";
    fb.textContent = "✓ Correct!";
    mcqState[qIdx] = true;
  } else {
    chosen.classList.add("wrong");
    correctEl.classList.add("correct");
    fb.className = "feedback wrong";
    fb.textContent = "✗ Not quite — the correct answer is highlighted.";
    mcqState[qIdx] = false;
  }
}

async function saveMCQ(topicId) {
  const bank = QUIZZES[topicId].mcq;
  let score = 0;
  bank.forEach((_, i) => { if (mcqState[i]) score++; });
  state.quizResults[topicId] = state.quizResults[topicId] || {};
  state.quizResults[topicId].mcq = { score, total: bank.length, at: Date.now() };
  saveLocal();
  await pushQuiz(topicId);
  alert(`Saved ${score}/${bank.length}. Syncing to teacher dashboard.`);
  go("topic", { id: topicId });
}

function checkPin() {
  const pin = document.getElementById("pin").value.trim();
  if (pin === "1234") {
    state.teacherMode = true;
    saveLocal();
    renderTeacher();
  } else {
    alert("Incorrect PIN. Demo PIN is 1234.");
  }
}

function lockTeacher() {
  state.teacherMode = false;
  if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
  saveLocal();
  go("home");
}

function saveProfile() {
  const name = document.getElementById("s-name").value.trim();
  const klass = document.getElementById("s-class").value.trim();
  if (!name) { alert("Please enter your name."); return; }
  state.student = { name, klass };
  saveLocal();
  pushProgress("__profile__");
  alert("Profile saved and synced.");
  go("home");
}

async function pushAll() {
  for (const lid of Object.keys(state.progress)) {
    if (state.progress[lid]) await pushProgress(lid);
  }
  for (const tid of [1, 2, 3]) {
    if (state.quizResults[tid]?.mcq) await pushQuiz(tid);
  }
  alert("Re-synced all progress.");
}

function resetAll() {
  if (!confirm("Erase all progress on this device? (Teacher dashboard keeps its records.)")) return;
  localStorage.removeItem("itcoach_v2");
  state = DEFAULT_STATE();
  go("home");
}

/* ============ BOOT ============ */
if (!state.student) {
  state.view = { name: "settings", params: {} };
}
go(state.view.name, state.view.params);
