<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Coach</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#173b67;color:#fff;padding:18px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 2px 6px #bbb}button{border:0;border-radius:8px;padding:10px 13px;background:#1769aa;color:#fff;cursor:pointer}.secondary{background:#52657a}main{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #d8dee8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.topic{border-left:6px solid #1769aa}.small{color:#5d6878}.progress{height:14px;background:#e1e6ed;border-radius:8px;overflow:hidden}.bar{height:100%;background:#1769aa;width:0}footer{text-align:center;padding:25px;color:#667}code{background:#eef2f7;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<header><h1>IT Coach — Full Content Browser</h1><p>Interactive learning and assessment prototype • All 8 topics</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>IT Coach • Browser-only prototype • Local progress storage</footer>
<script>
const topics=[
["1","Fundamentals of IT","IPOS, CPU, memory, storage, number systems, software and information processing",["Input → Processing → Output → Storage (IPOS).","RAM is temporary working memory; ROM retains instructions.","Data is represented using binary, decimal, octal and hexadecimal."]],
["2","Networks and Communication","Network types, hardware, transmission and Internet services",["Networks connect devices to communicate and share resources.","Switches, routers and wireless access points support connectivity.","Internet services include web, email, cloud and online communication."]],
["3","Social and Economic Impact of IT","Work, society, security, health, ethics and law",["IT improves productivity and communication while creating privacy and security risks.","Security controls include passwords, access restrictions, backups and updates.","Responsible IT use considers privacy, intellectual property and safety."]],
["4","Word Processing, Presentations and Web Pages","Documents, presentations and web content",["Word processors support editing, formatting, tables and images.","Presentation software communicates ideas using slides and media.","Web pages organize information for viewing through browsers."]],
["5","Spreadsheets","Cells, formulas, functions, sorting, charts and worksheets",["Spreadsheets organize information in rows and columns.","Formulas and functions calculate values.","Charts visualize data and sorting organizes records."]],
["6","Databases","Tables, keys, queries, reports and validation",["Databases organize related information in tables.","A primary key uniquely identifies a record.","Queries retrieve selected information and reports present results."]],
["7","Problem Solving and Program Design","Algorithms, pseudocode, flowcharts, data types and testing",["An algorithm is a finite sequence of steps.","Flowcharts visually represent program logic.","Trace tables help test variable changes."]],
["8","Programming in Pascal","Pascal syntax, control structures, arrays, testing and documentation",["Pascal uses structured statements, variables and input/output.","Selection makes decisions and repetition repeats instructions.","Testing checks normal, boundary and invalid inputs."]]
];
const checks=[
["Which stage comes after Input in IPOS?","Processing",["Storage","Processing","Output","Validation"]],
["Which device commonly connects different networks?","Router",["Keyboard","Router","Monitor","Printer"]],
["Which is a security control?","Access restriction",["Ignoring updates","Access restriction","Sharing passwords","Removing backups"]],
["What is commonly used to create slide presentations?","Presentation software",["Spreadsheet software","Presentation software","Database software","Compiler"]],
["Which spreadsheet function adds values?","SUM",["COUNT","SUM","IF","MAX"]],
["What uniquely identifies a database record?","Primary key",["Foreign key","Primary key","Query","Report"]],
["What is a finite sequence of steps to solve a problem?","Algorithm",["Algorithm","Database","Network","Report"]],
["Which control structure repeats instructions?","Repetition",["Selection","Repetition","Declaration","Input"]]
];
let score=0,answered=0;
const app=document.getElementById("app"),nav=document.getElementById("nav");
function btn(label,fn,cls=""){const b=document.createElement("button");b.textContent=label;b.onclick=fn;if(cls)b.className=cls;return b}
function home(){app.innerHTML='<div class="card"><h2>Dashboard</h2><p>Choose a topic to learn, practice and assess.</p><div class="grid">'+topics.map(t=>'<div class="card topic"><h3>Topic '+t[0]+' — '+t[1]+'</h3><p>'+t[2]+'</p><button onclick="topic(\''+t[0]+'\')">Open Topic</button></div>').join("")+'</div></div>'}
function topic(n){const t=topics.find(x=>x[0]===n),c=checks[+n-1];app.innerHTML='<div class="card"><h2>Topic '+t[0]+' — '+t[1]+'</h2><p>'+t[2]+'</p><h3>Lesson</h3>'+t[3].map((x,i)=>'<div class="card"><b>'+(i+1)+'.</b> '+x+'</div>').join("")+'<div class="card"><h3>Knowledge Check</h3><p><b>'+c[0]+'</b></p><div id="choices"></div><p id="feedback"></p></div></div>';const box=document.getElementById("choices");c[2].forEach(ch=>{const b=btn(ch,()=>{box.querySelectorAll("button").forEach(x=>x.disabled=true);if(ch===c[1]){score++;b.textContent=ch+" ✓";}else{b.textContent=ch+" ✗";}answered++;document.getElementById("feedback").textContent="Correct answer: "+c[1]}, "choice");box.appendChild(b)})}
function practice(){app.innerHTML='<div class="card"><h2>Practice Centre</h2><p>Answer the 8 topic questions.</p><div id="p"></div></div>';const p=document.getElementById("p");checks.forEach((c,i)=>{const d=document.createElement("div");d.className="card";d.innerHTML="<b>"+(i+1)+". "+c[0]+"</b>";c[2].forEach(ch=>{const b=btn(ch,()=>{d.querySelectorAll("button").forEach(x=>x.disabled=true);if(ch===c[1]){score++;b.textContent=ch+" ✓"}else b.textContent=ch+" ✗";answered++});d.appendChild(b)});p.appendChild(d)})}
function assess(){const pct=answered?Math.round(score/answered*100):0;app.innerHTML='<div class="card"><h2>Assessment Results</h2><p>Correct: <b>'+score+'</b> of '+answered+' attempted.</p><p>Accuracy: <b>'+pct+'%</b></p><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><p>'+(pct>=80?"Strong performance. Continue to consolidate.":"Revision recommended. Revisit the weaker topics and try again.")+'</p></div>'}
function progress(){const pct=answered?Math.round(score/answered*100):0;app.innerHTML='<div class="card"><h2>Progress</h2><p>Questions answered: '+answered+'</p><p>Correct answers: '+score+'</p><p>Current accuracy: '+pct+'%</p><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div></div>'}
function buildNav(){nav.innerHTML="";nav.append(btn("Dashboard",home));nav.append(btn("Practice",practice));nav.append(btn("Assessment",assess));nav.append(btn("Progress",progress));topics.forEach(t=>nav.append(btn("T"+t[0],()=>topic(t[0]),"secondary")))}
buildNav();home();
</script>
</body>
</html>
