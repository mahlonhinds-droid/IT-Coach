<style>
  :root {
    --bg: #f6f8fa;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {

    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
  header.appbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--primary); color: #fff; margin: -16px -16px 16px;
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow);
  }
  header.appbar h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  header.appbar button { background: rgba(255,255,255,.15); color: #fff; border: 0;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  header.appbar button:active { transform: scale(.97); }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .card h2 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 6px 0; color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px;
    border-radius: 999px; background: #ccfbf1; color: var(--primary-dark); margin-right: 4px; }
  .pill.amber { background: #fef3c7; color: #92400e; }
  .pill.grey { background: #e2e8f0; color: #475569; }
  button.btn {
    background: var(--primary); color: #fff; border: 0; padding: 10px 14px;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .05s ease;
  }
  button.btn:active { transform: scale(.98); }
  button.btn.secondary { background: #e2e8f0; color: var(--text); }
  button.btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  button.btn.small { padding: 6px 10px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 560px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  .progress-bar { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--primary); transition: width .3s; }
  .opt {
    display: block; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; margin: 8px 0; cursor: pointer; background: #fff;
    font-size: 14px;
  }
  .opt:hover { border-color: var(--primary); }
  .opt.selected { border-color: var(--primary); background: #f0fdfa; }
  .opt.correct { border-color: var(--correct); background: #f0fdf4; }
  .opt.wrong { border-color: var(--wrong); background: #fef2f2; }
  .opt input { margin-right: 10px; }
  .feedback { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-top: 10px; }
  .feedback.correct { background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
  .feedback.wrong { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
  .feedback.info { background: #eff6ff; color: #1e40af; border: 1px solid #93c5fd; }
  textarea, input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; font-family: inherit; font-size: 14px; background: #fff;
  }
  textarea { min-height: 90px; resize: vertical; }
  .muted { color: var(--muted); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .kpi { background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; text-align: center; }
  .kpi .num { font-size: 20px; font-weight: 700; color: var(--primary); }
  .kpi .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .flash { animation: flash 1s ease; }
  @keyframes flash { 0%,100% { background: transparent; } 50% { background: #fef9c3; } }
  .hidden { display: none !important; }
  .lesson-diagram { background: #f8fafc; border: 1px dashed var(--border); border-radius: 10px;

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .tab { padding: 8px 12px; border-radius: 999px; background: #e2e8f0; color: var(--text);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 0; }
  .tab.active { background: var(--primary); color: #fff; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>

const STORAGE_KEY = "itcoach_v1";
const app = document.getElementById("app");

const defaultState = () => ({
  student: null,              // { name, class }
  progress: {},               // { "1.1": true, ... }
  quizResults: {},            // { "1": { mcq: {score, total, answers}, short: {selfRatings: [...]} } }
  teacherMode: false,
  view: { name: "home", params: {} }
});

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return { ...defaultState(), ...parsed };
  } catch { return defaultState(); }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ---------------------------------------------------------------------------
// 4. HELPERS
// ---------------------------------------------------------------------------
const $ = (html) => { app.innerHTML = html; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const getTopic = (id) => COURSE.topics.find(t => t.id === +id);
const getLesson = (tid, lid) => getTopic(tid)?.lessons.find(l => l.id === lid);

function topicProgress(topicId) {
  const topic = getTopic(topicId);
  const total = topic.lessons.length;
  const done = topic.lessons.filter(l => state.progress[l.id]).length;
  return { done, total, pct: Math.round(100 * done / total) };
}
function overallProgress() {
  let done = 0, total = 0;
  COURSE.topics.forEach(t => { const p = topicProgress(t.id); done += p.done; total += p.total; });
  return { done, total, pct: Math.round(100 * done / total) };
}

function renderBlock(b) {
  switch (b.type) {
    case "h3": return `<h3 style="margin:14px 0 4px;font-size:15px;color:${'var(--primary-dark)'}">${esc(b.text)}</h3>`;
    case "p": return `<p>${esc(b.text)}</p>`;
    case "list": return `<ul style="margin:6px 0 6px 18px;padding:0">${b.items.map(i => `<li style="margin:4px 0;font-size:14px">${esc(i)}</li>`).join("")}</ul>`;
    case "diagram": return `<div class="lesson-diagram">📊 ${esc(b.label)}</div>`;
    case "callout": {
      const colors = { tip: "#0f766e", info: "#0284c7", warn: "#ea580c" };
      const bg = { tip: "#f0fdfa", info: "#eff6ff", warn: "#fff7ed" };
      return `<div style="border-left:3px solid ${colors[b.variant]||colors.tip};background:${bg[b.variant]||bg.tip};padding:10px 12px;border-radius:8px;font-size:13.5px;margin:8px 0">${esc(b.text)}</div>`;
    }
    case "table": return `
      <div style="overflow-x:auto;margin:8px 0">
        <table><thead><tr>${b.headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
      </div>`;
    default: return "";
  }
}

            <th>Student</th><th>Class</th><th>Progress</th><th>MCQ 1</th><th>MCQ 2</th><th>MCQ 3</th><th>Last active</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><b>${esc(r.name)}</b></td>
                <td>${esc(r.klass)}</td>
                <td>${r.progressPct}%</td>
                <td>${fmtPct(r.mcq1)}</td>
                <td>${fmtPct(r.mcq2)}</td>
                <td>${fmtPct(r.mcq3)}</td>
                <td class="muted">${r.lastActive ? new Date(r.lastActive).toLocaleDateString() : "—"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>`}
    </div>
    <div class="card">
      <h2>Topic breakdown (class average)</h2>
      ${COURSE.topics.map(t => {
        const rowsForTopic = rows.filter(r => r.topicProgress && r.topicProgress[t.id] !== undefined);
        const avg = rowsForTopic.length
          ? Math.round(rowsForTopic.reduce((a, r) => a + r.topicProgress[t.id], 0) / rowsForTopic.length)
          : 0;
        return `
          <div style="margin:8px 0">
            <div class="row" style="justify-content:space-between">
              <span style="font-size:13.5px;font-weight:600">${t.icon} ${esc(t.title)}</span>
              <span class="muted">${avg}%</span>
            </div>
            <div class="progress-bar" style="margin-top:4px"><div style="width:${avg}%;background:${t.color}"></div></div>
          </div>`;
      }).join("")}
    </div>
    <div class="card">
      <h2>Export class report (CSV)</h2>
      <button class="btn secondary" onclick="exportCSV()">Download CSV</button>
    </div>
  `);
}

function fmtPct(v) {
  if (v === undefined || v === null) return "—";
  const color = v >= 70 ? "var(--correct)" : v >= 50 ? "var(--warn)" : "var(--wrong)";
  return `<span style="color:${color};font-weight:700">${v}%</span>`;
}

function renderSettings() {
  const student = state.student || {};
  $(`
    <header class="appbar"><button onclick="go('home')">← Back</button><h1>Settings</h1></header>
    <div class="card">
      <h2>Student profile</h2>
      <label class="muted">Name</label>
      <input type="text" id="s-name" value="${esc(student.name || "")}" placeholder="e.g. Jane Doe" />
      <label class="muted" style="display:block;margin-top:10px">Class</label>
      <input type="text" id="s-class" value="${esc(student.klass || "")}" placeholder="e.g. 5A" />
      <button class="btn" onclick="saveProfile()" style="margin-top:12px">Save profile</button>
    </div>
    <div class="card">
      <h2>Export my results</h2>
      <p class="muted">Copy this code and send it to your teacher. It contains your progress and quiz scores only.</p>
      <textarea id="exportBox" readonly>${makeExportCode()}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="copyExport()">Copy code</button>
      </div>
    </div>
    <div class="card">
      <h2>Reset</h2>
      <p class="muted">This clears your progress and quiz results on this device.</p>
      <button class="btn" style="background:var(--wrong)" onclick="resetAll()">Reset all data</button>
    </div>
    <div class="footer">IT Coach CSEC · Prototype · Data stays on your device</div>
  `);
}

// ---------------------------------------------------------------------------
// 6. NAVIGATION
// ---------------------------------------------------------------------------
function go(name, params = {}) {
  state.view = { name, params };
  saveState();
  window.scrollTo({ top: 0 });
  const views = {
    home: renderHome,
    topic: renderTopic,
    lesson: renderLesson,
    quiz: renderQuiz,
    teacher: renderTeacher,
    settings: renderSettings
  };
  (views[name] || renderHome)(params);
}
window.go = go;

function toggleAnswer(id) {
  document.getElementById(id).classList.toggle("hidden");
}
window.toggleAnswer = toggleAnswer;

function switchTab(which) {
  document.getElementById("tab-mcq").classList.toggle("active", which === "mcq");
  document.getElementById("tab-short").classList.toggle("active", which === "short");
  document.getElementById("panel-mcq").classList.toggle("hidden", which !== "mcq");
  document.getElementById("panel-short").classList.toggle("hidden", which !== "short");
}
window.switchTab = switchTab;

// ---------------------------------------------------------------------------
// 7. LESSON + QUIZ INTERACTIONS
// ---------------------------------------------------------------------------
function markLesson(lid, val) {
  state.progress[lid] = val;
  saveState();
  go("lesson", { tid: +lid.split(".")[0], lid });
}
window.markLesson = markLesson;

const mcqState = {};   // per-page-session answers
function answerMCQ(qIdx, optIdx, correct) {
  // Disable all options for this question
  const card = document.getElementById(`mcq-card-${qIdx}`);
  card.querySelectorAll(".opt").forEach(el => el.style.pointerEvents = "none");
  const chosen = document.getElementById(`opt-${qIdx}-${optIdx}`);
  const correctEl = document.getElementById(`opt-${qIdx}-${correct}`);
  if (optIdx === correct) {
    chosen.classList.add("correct");
    document.getElementById(`fb-${qIdx}`).className = "feedback correct";
    document.getElementById(`fb-${qIdx}`).textContent = "✓ Correct!";
  } else {
    chosen.classList.add("wrong");
    correctEl.classList.add("correct");
    document.getElementById(`fb-${qIdx}`).className = "feedback wrong";
    document.getElementById(`fb-${qIdx}`).textContent = "✗ Not quite — the correct answer is highlighted.";
  }
  mcqState[qIdx] = (optIdx === correct);
}
window.answerMCQ = answerMCQ;

function saveMCQ(topicId) {
  const bank = QUIZZES[topicId].mcq;
  let score = 0;
  bank.forEach((_, i) => { if (mcqState[i]) score++; });
  state.quizResults[topicId] = state.quizResults[topicId] || {};
  state.quizResults[topicId].mcq = { score, total: bank.length, at: Date.now() };
  state.lastActive = Date.now();
  saveState();
  document.getElementById("mcq-score").innerHTML =
    `Saved: <b>${score}/${bank.length}</b> · ${new Date().toLocaleString()}`;
}
window.saveMCQ = saveMCQ;

const shortRatings = {};
function revealModel(i) {
  document.getElementById(`model-${i}`).classList.remove("hidden");
  document.getElementById(`rate-${i}`).classList.remove("hidden");
}
window.revealModel = revealModel;

function rate(i, val) {
  shortRatings[i] = val;
  const colors = { got: "var(--correct)", almost: "var(--warn)", review: "var(--wrong)" };
  document.querySelectorAll(`#rate-${i} button`).forEach(b => b.style.opacity = 0.4);
  event.target.style.opacity = 1;
  event.target.style.background = colors[val];
}
window.rate = rate;

function saveShort(topicId) {
  state.quizResults[topicId] = state.quizResults[topicId] || {};
  state.quizResults[topicId].short = { ratings: { ...shortRatings }, at: Date.now() };
  state.lastActive = Date.now();
  saveState();
  alert("Short-answer ratings saved.");
}
window.saveShort = saveShort;

// ---------------------------------------------------------------------------
// 8. TEACHER MODE
// ---------------------------------------------------------------------------
function checkPin() {
  const pin = document.getElementById("pin").value.trim();
  if (pin === "1234") {
    state.teacherMode = true;
    saveState();
    renderTeacher();
  } else {
    alert("Incorrect PIN. Demo PIN is 1234.");
  }
}
window.checkPin = checkPin;

function lockTeacher() {
  state.teacherMode = false;
  saveState();
  go("home");
}
window.lockTeacher = lockTeacher;

// ---------------------------------------------------------------------------
// 9. EXPORT / IMPORT
// ---------------------------------------------------------------------------
function makeExportCode() {
  const payload = {
    v: 1,
    name: state.student?.name || "Anonymous",
    klass: state.student?.klass || "",
    progress: state.progress,
    quizResults: state.quizResults,
    lastActive: state.lastActive || Date.now()
  };
  try {
    return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  } catch { return ""; }
}
window.makeExportCode = makeExportCode;

function copyExport() {
  const el = document.getElementById("exportBox");
  el.select();
  document.execCommand("copy");
  alert("Code copied to clipboard.");
}
window.copyExport = copyExport;

function importCodes() {
  const raw = document.getElementById("importCodes").value.trim();
  if (!raw) return;
  const lines = raw.split(/\s+/).filter(Boolean);
  const imported = JSON.parse(localStorage.getItem("itcoach_imported") || "[]");
  let count = 0;
  for (const line of lines) {
    try {
      const json = JSON.parse(decodeURIComponent(escape(atob(line))));
      if (json && json.name) { imported.push(json); count++; }
    } catch (e) { /* skip invalid */ }
  }
  // De-duplicate by name+lastActive
  const seen = new Set();
  const unique = imported.filter(r => {
    const k = `${r.name}|${r.lastActive}`;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  localStorage.setItem("itcoach_imported", JSON.stringify(unique));
  alert(`Imported ${count} record(s).`);
  renderTeacherDashboard();
}
window.importCodes = importCodes;

function clearImported() {
  if (!confirm("Clear all imported student records?")) return;
  localStorage.removeItem("itcoach_imported");
  renderTeacherDashboard();
}
window.clearImported = clearImported;

function getLeaderboardData() {
  const imported = JSON.parse(localStorage.getItem("itcoach_imported") || "[]");
  // Also include the current student as a demo row
  const self = {
    name: state.student?.name || "You (demo)",
    klass: state.student?.klass || "—",
    progress: state.progress,
    quizResults: state.quizResults,
    lastActive: state.lastActive || Date.now()
  };
  const all = [...imported, self];
  const seen = new Set();
  return all.filter(r => {
    const k = `${r.name}|${r.lastActive}`;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).map(r => {
    const progressKeys = Object.keys(r.progress || {}).filter(k => r.progress[k]);
    const totalLessons = COURSE.topics.reduce((a, t) => a + t.lessons.length, 0);
    const topicProgress = {};
    COURSE.topics.forEach(t => {
      const done = t.lessons.filter(l => r.progress && r.progress[l.id]).length;
      topicProgress[t.id] = Math.round(100 * done / t.lessons.length);
    });
    const mcq = (tid) => {
      const q = r.quizResults?.[tid]?.mcq;
      return q ? Math.round(100 * q.score / q.total) : undefined;
    };
    return {
      name: r.name || "Anonymous",
      klass: r.klass || "—",
      progressPct: Math.round(100 * progressKeys.length / totalLessons),
      topicProgress,
      mcq1: mcq(1), mcq2: mcq(2), mcq3: mcq(3),
      lastActive: r.lastActive
    };
  });
}
window.getLeaderboardData = getLeaderboardData;

function exportCSV() {
  const rows = getLeaderboardData();
  const header = "Name,Class,Progress %,MCQ Topic 1 %,MCQ Topic 2 %,MCQ Topic 3 %,Last Active\n";
  const body = rows.map(r => [
    `"${r.name}"`, `"${r.klass}"`, r.progressPct,
    r.mcq1 ?? "", r.mcq2 ?? "", r.mcq3 ?? "",
    r.lastActive ? new Date(r.lastActive).toISOString() : ""
  ].join(",")).join("\n");
  const blob = new Blob([header + body], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "it-coach-class-report.csv";
  a.click(); URL.revokeObjectURL(url);
}
window.exportCSV = exportCSV;

// ---------------------------------------------------------------------------
// 10. PROFILE + RESET
// ---------------------------------------------------------------------------
function saveProfile() {
  state.student = {
    name: document.getElementById("s-name").value.trim() || "Student",
    klass: document.getElementById("s-class").value.trim()
  };
  saveState();
  alert("Profile saved.");
  go("home");
}
window.saveProfile = saveProfile;

function resetAll() {
  if (!confirm("This will erase all your progress and quiz results on this device. Continue?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  go("home");
}
window.resetAll = resetAll;

// ---------------------------------------------------------------------------
// 11. BOOT
// ---------------------------------------------------------------------------
if (!state.student) {
  // First-run: show settings so student can enter name
  state.view = { name: "settings", params: {} };
}
go(state.view.name, state.view.params);
</script>
</body>
</html>
