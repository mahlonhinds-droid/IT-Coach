<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Coach — Integrated Runtime</title>
<style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}header{background:#172033;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}button{border:0;border-radius:10px;padding:11px 14px;margin:5px;background:#1f6feb;color:#fff;cursor:pointer}.secondary{background:#e8eef7;color:#172033}.option{display:block;width:100%;text-align:left;background:#eef4ff;color:#172033}.bar{height:10px;background:#1f6feb;border-radius:8px}.track{height:10px;background:#e4e9f0;border-radius:8px}.small{color:#667085;font-size:.92rem}.score{font-size:2rem;font-weight:700}</style></head>
<body><header><strong>IT Coach</strong><div class="small" style="color:#d7e2f0">Integrated Student Runtime • Browser-only</div></header><main id="app"></main>
<script>
const bank=[
{id:"T1",topic:"1",title:"Fundamentals of IT",q:"Which sequence follows Learn in the IT Coach cycle?",a:["Practice → Assess","Stop → Finish","Skip → Submit"],c:0},
{id:"T2",topic:"2",title:"Networks and Communication",q:"Which network is designed for a limited local area?",a:["LAN","WAN","MAN"],c:0},
{id:"T3",topic:"3",title:"Social and Economic Impact of IT",q:"Which is a security countermeasure?",a:["Encryption","Sharing passwords","Ignoring updates"],c:0},
{id:"T4",topic:"4",title:"Word Processing, Presentations and Web Pages",q:"Which task belongs to word processing?",a:["Formatting a document","Routing network traffic","Tracing Pascal variables"],c:0},
{id:"T5",topic:"5",title:"Spreadsheets",q:"Which function can total a range?",a:["SUM","ROUTE","QUERY"],c:0},
{id:"T6",topic:"6",title:"Databases",q:"Which database object retrieves records using conditions?",a:["Query","Slide","Router"],c:0},
{id:"T7",topic:"7",title:"Problem Solving and Program Design",q:"What is a trace table used for?",a:["Testing an algorithm step by step","Formatting slides","Connecting a modem"],c:0},
{id:"T8",topic:"8",title:"Programming in Pascal",q:"Which symbol is used for Pascal assignment?",a:[":=","==","=>"],c:0}
];
const S=JSON.parse(localStorage.itcoachIntegrated||'{}');S.done=S.done||{};S.scores=S.scores||{};let current=null;
function save(){localStorage.itcoachIntegrated=JSON.stringify(S)}
function home(){app.innerHTML='<div class="card"><h1>Learning Dashboard</h1><p><b>Learn → Practice → Assess → Diagnose → Remediate → Reassess → Master</b></p><p class="small">This is a functional integration prototype. Scores are diagnostic and not official CXC grades.</p></div>'+bank.map((x,i)=>{let s=S.scores[x.topic];return '<div class="card"><h2>Topic '+x.topic+'</h2><p>'+x.title+'</p>'+(s!==undefined?'<p>Latest mastery: <b>'+s+'%</b></p>':'<p class="small">Not assessed yet</p>')+'<button onclick="start('+i+')">Start Learning Cycle</button></div>'}).join('')}
function start(i){current=bank[i];app.innerHTML='<div class="card"><div class="small">Topic '+current.topic+'</div><h1>'+current.title+'</h1><div class="track"><div class="bar" style="width:25%"></div></div><h2>1. Learn</h2><p>The approved source-reviewed lesson content and interactive activity for this topic will load here.</p><button onclick="practice()">Continue to Practice</button><button class="secondary" onclick="home()">Dashboard</button></div>'}
function practice(){app.innerHTML='<div class="card"><div class="small">2. Practice</div><h2>'+current.q+'</h2>'+current.a.map((x,i)=>'<button class="option" onclick="assess('+i+')">'+x+'</button>').join('')+'</div>'}
function assess(choice){let ok=choice===current.c;S.scores[current.topic]=ok?100:0;save();app.innerHTML='<div class="card"><div class="small">3. Assess</div><div class="score">'+S.scores[current.topic]+'%</div><p>'+(ok?'Correct — strong evidence for this practice item.':'Not correct — this is a remediation signal.')+'</p><button onclick="diagnose()">Diagnose</button></div>'}
function diagnose(){let s=S.scores[current.topic],action=s<70?'Remediate':s<80?'Practice / Review':'Consolidate';app.innerHTML='<div class="card"><div class="small">4. Diagnose</div><h1>'+action+'</h1><p>Latest diagnostic mastery: <b>'+s+'%</b></p><p>'+ (s<70?'Return to the lesson and complete targeted practice before reassessment.':s<80?'Review the lesson and complete another practice set.':'Consolidate the skill and attempt reassessment.')+'</p><button onclick="remediate()">Remediation / Review</button></div>'}
function remediate(){app.innerHTML='<div class="card"><div class="small">5. Remediate</div><h2>Targeted revision</h2><p>Review the relevant lesson concept, then attempt a new practice item.</p><button onclick="reassess()">Reassess</button></div>'}
function reassess(){app.innerHTML='<div class="card"><div class="small">6. Reassess</div><h2>Ready for reassessment</h2><p>The production engine will select a different item when the approved question bank contains alternatives.</p><button onclick="master()">Run Reassessment</button></div>'}
function master(){S.scores[current.topic]=100;save();app.innerHTML='<div class="card"><div class="small">7. Mastery</div><h1>Mastery updated</h1><div class="score">100%</div><p>Prototype reassessment completed. The browser record has been updated.</p><button onclick="home()">Return to Dashboard</button></div>'}
home();
</script></body></html>
