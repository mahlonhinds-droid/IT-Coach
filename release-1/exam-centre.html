<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Coach Exam Centre</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}main{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}button{border:0;border-radius:10px;padding:11px 15px;margin:5px;background:#1f6feb;color:#fff}.secondary{background:#e8eef7;color:#172033}.small{color:#667085}</style></head><body><main id="app"></main><script src="exam-engine.js"></script><script>
function home(){app.innerHTML='<div class="card"><h1>IT Coach — Examination Centre</h1><p class="small">Prototype exam pathways. Official weighting remains configurable until the final approved assessment materials are locked.</p><div class="card"><h2>Paper 01</h2><p>Multiple Choice</p><button onclick="start(\'paper01\')">Start Paper 01</button></div><div class="card"><h2>Paper 02</h2><p>Structured Response</p><button onclick="start(\'paper02\')">Start Paper 02</button></div><div class="card"><h2>Paper 03</h2><p>SBA / Practical</p><button onclick="start(\'paper03\')">Start Paper 03</button></div></div>'}
function start(paper){const qs=ITCoachBuildExam(paper);window.exam={paper,qs};if(paper==="paper01"){app.innerHTML='<div class="card"><h1>'+ITCoachExamConfig[paper].title+'</h1>'+qs.map((q,i)=>'<div class="card"><b>Question '+(i+1)+'</b><p>'+q[2]+'</p>'+q[3].map((o,j)=>'<label style="display:block;margin:8px"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'</div>').join('')+'<button onclick="submitMCQ()">Submit Paper 01</button></div>'}else{app.innerHTML='<div class="card"><h1>'+ITCoachExamConfig[paper].title+'</h1><p class="small">Complete the responses as directed by your teacher/examiner.</p>'+qs.map((q,i)=>'<div class="card"><b>Question '+(i+1)+'</b><p>'+q[2]+'</p><textarea id="r'+i+'" style="width:100%;min-height:100px"></textarea></div>').join('')+'<button onclick="submitWritten()">Submit</button></div>'}}
function submitMCQ(){let e=window.exam,c=0;e.qs.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');if(x&&Number(x.value)===q[4])c++});let result={score:Math.round(c/e.qs.length*100),correct:c,total:e.qs.length};ITCoachSaveExamResult(e.paper,result);showResult(e.paper,result.score)}
function submitWritten(){let e=window.exam;const answered=e.qs.filter((q,i)=>document.getElementById('r'+i).value.trim()).length;let score=Math.round(answered/e.qs.length*100);ITCoachSaveExamResult(e.paper,{score});showResult(e.paper,score)}
function showResult(paper,score){app.innerHTML='<div class="card"><h1>Exam Result</h1><div style="font-size:2.5rem;font-weight:700">'+score+'%</div><p>'+ITCoachExamConfig[paper].title+'</p><p class="small">This prototype score is diagnostic. Structured and practical responses require teacher/examiner marking in production.</p><button onclick="home()">Return to Exam Centre</button></div>'}
home();
</script></main></body></html>
