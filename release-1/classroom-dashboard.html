<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Coach Classroom</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}button{padding:10px 14px;border:0;border-radius:9px;margin:4px;background:#246bce;color:white}.small{color:#667085}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"></main><script src="classroom-engine.js"></script><script>
function render(){let a=ITCoachClasses();if(!a.length){app.innerHTML='<div class="card"><h1>IT Coach Classroom</h1><p>No class exists in this browser yet.</p><button onclick="makeClass()">Create Form 4A Demo</button></div>';return}const c=a[0],s=ITCoachClassSummary(c.id);app.innerHTML='<div class="card"><h1>'+c.name+'</h1><p class="small">Teacher: '+c.teacher+' • Students: '+s.total+'</p><button onclick="addStudent()">Add Demo Student</button></div><div class="card"><h2>Topic Intervention Overview</h2>'+Object.keys(s.topics).map(n=>'<div class="card"><b>Topic '+n+'</b><div class="grid"><span>🔴 '+s.topics[n].remediate+' remediate</span><span>🟡 '+s.topics[n].practice+' practice</span><span>🟢 '+s.topics[n].consolidate+' consolidated</span><span>⚪ '+s.topics[n].unassessed+' unassessed</span></div></div>').join('')+'</div><div class="card"><h2>Students</h2>'+c.students.map(x=>'<p><b>'+x.name+'</b></p>').join('')+'</div>'}
function makeClass(){ITCoachCreateClass("Form 4A","Demo Teacher");render()}
function addStudent(){const c=ITCoachClasses()[0];ITCoachAddStudent(c.id,"Student "+(c.students.length+1));render()}
render();
</script></main></body></html>
