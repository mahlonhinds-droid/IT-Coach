const state=JSON.parse(localStorage.itcoachRuntime||'{}');state.done=state.done||{};let selected;
function save(){localStorage.itcoachRuntime=JSON.stringify(state)}
function renderStudentAssignments(){const e=document.getElementById('studentAssignments');if(!e)return;const a=ITCoachAssignments();e.innerHTML=a.length?'<h3>My Assignments</h3>'+a.map(x=>'<div class="card"><b>'+x.title+'</b><p>Topic '+x.topic+' • Status: <span class="pill">'+ITCoachAssignmentStatus(x.topic)+'</span></p><button onclick="startAssigned('+x.topic+')">Open Assignment</button></div>').join(''):'<p class="small">No assignments have been created in this browser yet.</p>';}
function startAssigned(topicNo){const n=String(topicNo);selected=topics.find(t=>t[0]===n);app.innerHTML='<div class="card"><div class="small">Assigned Learning</div><h1>Topic '+n+': '+selected[1]+'</h1><p>Your assigned learning path is ready.</p><button onclick="topic(\''+n+'\')">Start Topic</button><button onclick="assessment(\''+n+'\')">Take Assessment</button><button class="secondary" onclick="dashboard()">Dashboard</button></div>';}

function createTargetedRemediation(topicNo,skill){const p=ITCoachCreateRemediation(topicNo,skill);alert(p.skill+' remediation assigned. '+p.action);renderRemediationPanel(topicNo);}
function dashboard(){app.innerHTML='<div class="card"><h1>Student Dashboard</h1><p><b>Learn → Practice → Assess → Diagnose → Remediate → Reassess → Master</b></p><p class="small">Browser-only learning record. Prototype rules are not official CXC grades.</p><div id="studentAssignments"></div><div id="studentTodayPlan"></div><div id="studentPlanner"></div><div id="finalCrunchPlan"></div><div id="examReadiness"></div><div id="examErrorAnalysis"></div><div id="finalExamReadiness"></div><div id="final7DayCountdown"></div><div id="examDayChecklist"></div><div id="postExamNextCycle"></div><div id="integrationHealth"></div><div id="analyticsPanel"></div><div id="skillPanel"></div><div id="remediationPanel"></div><div id="learningPathPanel"></div><div id="coachPanel"></div><div id="tutorPanel"></div><div id="growthPanel"></div><div id="studentReportPanel"></div><div id="adaptiveAssessment"></div><div id="applicationActivity"></div><div id="practicalEvidence"></div><div id="practicalWorkspace"></div><div id="spreadsheetWorkspace"></div><div id="spreadsheetChart"></div><div id="wordWorkspace"></div><div id="presentationWorkspace"></div><div id="webWorkspace"></div><div id="topic4RichContent"></div><div id="topic4SkillsLab"></div><div id="topic4LabActive"></div><div id="topic4IntegratedWorkspace"></div><div id="topic4Progress"></div><div id="topic4PracticalScore"></div><div id="topic4Remediation"></div><div id="topic4Reassessment"></div><div id="topic4Mastery"></div><div id="topic4Portfolio"></div><div id="topic4TeacherView"></div><div id="topic4Interventions"></div><div id="topic4InterventionPlanner"></div><div id="topic4InterventionStatus"></div><div id="topic6Content"></div><div id="topic6SkillsLab"></div><div id="databaseWorkspace"></div><div id="databaseWorkspaceV2"></div><div id="databaseVisualBuilder"></div><div id="databaseLiveObjects"></div><div id="databaseSubform"></div><div id="topic6TeacherView"></div><div id="topic6Remediation"></div><div id="topic6Portfolio"></div><div id="topic6MasteryCentre"></div><div id="unifiedTopicMap"></div><div id="eightTopicJourney"></div><div id="topic13SkillsLab"></div><div id="topic13Mastery"></div><div id="topic13Course"></div><div id="topic13Interactive"></div><div id="topic13Adaptive"></div><div id="adaptiveDashboard"></div><div id="studentMasteryProfile"></div><div id="studentGrowthTimeline"></div><div id="universalMasteryProfile"></div><div id="universalEvidenceBreakdown"></div><div id="masteryDecision"></div><div id="personalizedIntervention"></div><div id="interventionAction"></div><div id="teacherInterventionAlert"></div><div id="teacherInterventionCentre"></div><div id="teacherStudentEvidence"></div><div id="learnerModePanel"></div><div id="selfDirectedDashboard"></div><div id="studentCommandCentre"></div><div id="studentGoalProgress"></div><div id="studentMilestones"></div><div id="databaseLabActive"></div><div class="card"><button onclick="ITCoachPrintStudentReport(1)">Print / Save Student Report</button></div></div><div class="grid">'+topics.map(t=>{let n=t[2].length,d=t[2].filter((_,i)=>state.done[t[0]+'.'+(i+1)]).length;return '<div class="card"><h2>Topic '+t[0]+'</h2><p>'+t[1]+'</p><div class="progress"><div class="bar" style="width:'+Math.round(d/n*100)+'%"></div></div><p class="small">'+d+'/'+n+' lessons completed</p><button onclick="topic(\''+t[0]+'\')">Open Topic</button></div>'}).join('')+'</div>'}
function topic(n){selected=topics.find(t=>t[0]===n);app.innerHTML='<div class="card"><div class="small">CSEC Information Technology</div><h1>Topic '+selected[0]+': '+selected[1]+'</h1>'+selected[2].map((x,i)=>'<button class="option" onclick="lesson('+i+')">'+(state.done[selected[0]+'.'+(i+1)]?'✓ ':'')+x+'</button>').join('')+'<button onclick="practice(\''+selected[0]+'\')">Practice</button>'+'<button onclick="assessment(\''+selected[0]+'\')">Take Topic Assessment</button>'+(['4','5','6','7','8'].includes(selected[0])?'<button onclick="showWorkspace(\''+selected[0]+'\')">Practical Workspace</button>':'')+'<button class="secondary" onclick="dashboard()">Back</button><button onclick="ITCoachRenderTeacherDashboard()">Teacher Dashboard</button></div>'}
function lesson(i){let id=selected[0]+'.'+(i+1),title=selected[2][i];app.innerHTML='<div class="card"><div class="small">Topic '+selected[0]+' / Lesson '+id+'</div><h1>'+title+'</h1><h3>Learning objectives</h3><p class="small">Source-mapped lesson content is displayed below. Final production wording remains subject to review against the approved workbook.</p><div id="lessonContent"></div><div class="card"><h3>Learn</h3><p>The reusable lesson runtime is active and can display source-mapped content blocks and activities.</p><span class="pill">Source-mapped</span><span class="pill">Browser-only</span></div><button onclick="check(\''+id+'\')">Knowledge Check</button><button class="secondary" onclick="topic(\''+selected[0]+'\')">Back to topic</button></div>'}
let activePractice=null;
function practice(topicNo){
 const q=ITCoachGetPractice(topicNo)[0];
 if(!q){app.innerHTML='<div class="card"><p>No practice item is available for this topic yet.</p><button onclick="topic(\''+topicNo+'\')">Back</button></div>';return;}
 activePractice=q;
 app.innerHTML='<div class="card"><div class="small">Practice • Topic '+q.topic+'</div><h2>'+q.prompt+'</h2>'+q.options.map((x,i)=>'<button class="option" onclick="submitPractice('+i+')">'+x+'</button>').join('')+'<div id="practiceFeedback"></div><button class="secondary" onclick="topic(\''+topicNo+'\')">Back to topic</button></div>';
}
function submitPractice(choice){
 if(!activePractice)return;
 const result=ITCoachScorePractice(activePractice,choice);
 if(typeof ITCoachRecordPracticeResult==="function")ITCoachRecordPracticeResult(1,activePractice,result);
 const e=document.getElementById('practiceFeedback');
 if(e)e.innerHTML='<div class="card"><strong>'+result.feedback+'</strong><p>Practice result recorded as learning evidence for '+activePractice.skill+'.</p><button onclick="practice(\''+activePractice.topic+'\')">Try another</button><button onclick="assessment(\''+activePractice.topic+'\')">Take assessment</button></div>';
}
function check(id){app.innerHTML='<div class="card"><div class="small">Knowledge Check</div><h2>What comes after a learning activity in the IT Coach cycle?</h2><button class="option" onclick="feedback(\''+id+'\',true)">Practice or assess the learning</button><button class="option" onclick="feedback(\''+id+'\',false)">End the learning cycle</button><div id="feedback"></div></div>'}
function feedback(id,ok){document.getElementById('feedback').innerHTML='<div class="card"><strong>'+(ok?'Correct.':'Review the learning cycle.')+'</strong><p>The runtime continues through practice, assessment, diagnosis, remediation, reassessment and mastery.</p><button onclick="finish(\''+id+'\')">Complete Lesson</button></div>'}

const assessmentBank=[
['1','hardware','Which sequence best represents the learning cycle after Learn?',['Practice → Assess','Stop → Finish','Skip → Submit'],0],['1','information-processing','Which stage follows assessment when a weakness is detected?',['Diagnosis','Logout','Deletion'],0],
['2','network','Which network is designed for a limited local area?',['LAN','WAN','MAN'],0],['2','transmission-media','Which technology is a wireless networking technology?',['Wi-Fi','Paper mail','Printer ink'],0],
['3','security','Which is a security countermeasure?',['Encryption','Sharing passwords','Ignoring updates'],0],['3','countermeasure','Which threat can involve a deceptive email designed to obtain information?',['Phishing','Formatting','Sorting'],0],
['4','word-processing','Which task belongs to word processing?',['Formatting a document','Routing network traffic','Tracing Pascal variables'],0],['4','web-page','Which activity belongs to web-page design?',['Planning page structure','Changing a router password','Tracing an algorithm'],0],
['5','charts','Which function can total a range?',['SUM','ROUTE','QUERY'],0],['5','Spreadsheets','Which feature can help display spreadsheet data visually?',['Chart','Router','Firewall'],0],
['6','database-design','Which database object retrieves records using conditions?',['Query','Slide','Router'],0],['6','Databases','What is a database record?',['A collection of related field values','A network cable','A presentation slide'],0],
['7','trace-tables','What is a trace table used for?',['Testing an algorithm step by step','Formatting slides','Connecting a modem'],0],['7','algorithms','Which is an algorithm representation?',['Pseudocode','Password','Spreadsheet chart'],0],
['8','programming-languages','Which symbol is used for Pascal assignment?', [':=','==','=>'],0],['8','testing-debugging','Which area belongs to program testing?',['Debugging','Slide design','Network cabling'],0]
];
function assessment(topicNo,reassess=false){let pool=assessmentBank.filter(q=>q[0]===String(topicNo));let previous=(state.attempted&&state.attempted[topicNo])||[];if(reassess){let fresh=pool.filter(q=>!previous.includes(q[1]+q[2]));if(fresh.length>=2)pool=fresh}pool.sort(()=>Math.random()-.5);let qs=pool.slice(0,Math.min(5,pool.length));window.currentAssessment={topic:String(topicNo),qs:qs,reassess:reassess};app.innerHTML='<div class="card"><div class="small">'+(reassess?'Reassessment':'Assessment')+'</div><h1>Topic '+topicNo+' Assessment</h1><p>Answer all questions. Your score will be used as diagnostic evidence.</p>'+qs.map((q,i)=>'<div class="card"><b>Question '+(i+1)+'</b><p>'+q[2]+'</p>'+q[3].map((o,j)=>'<label style="display:block;margin:8px"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'</div>').join('')+'<button onclick="submitAssessment()">Submit Assessment</button><button class="secondary" onclick="topic(\''+topicNo+'\')">Cancel</button></div>'}
function submitAssessment(){let a=window.currentAssessment,correct=0,skills={};a.qs.forEach((q,i)=>{let el=document.querySelector('input[name=q'+i+']:checked'),ok=el&&Number(el.value)===q[4];if(ok)correct++;skills[q[1]]=skills[q[1]]||{correct:0,total:0};skills[q[1]].total++;if(ok)skills[q[1]].correct++});let score=Math.round(correct/a.qs.length*100);
if(typeof ITCoachRecordUniversalEvidence==="function"){
  Object.entries(skills).forEach(([skill,v])=>{
    const skillScore=Math.round(v.correct/v.total*100);
    ITCoachRecordUniversalEvidence({studentId:1,topicNo:a.topic,skill,type:a.reassess?"reassessment":"knowledge",score:skillScore,source:"student-assessment",evidence:a.reassess?"Reassessment result":"Assessment result"});
  });
}
state.scores=state.scores||{};state.scores[a.topic]=score;state.attempted=state.attempted||{};state.attempted[a.topic]=state.attempted[a.topic]||[];a.qs.forEach(q=>{if(!state.attempted[a.topic].includes(q[1]+q[2]))state.attempted[a.topic].push(q[1]+q[2])});save();let action=score<70?'Remediate':score<80?'Practice / Review':'Consolidate';let weak=Object.entries(skills).sort((x,y)=>x[1].correct/x[1].total-y[1].correct/y[1].total)[0];app.innerHTML='<div class="card"><div class="small">Assessment Result</div><h1>'+score+'%</h1><p><b>'+correct+' / '+a.qs.length+' correct</b></p><p>Recommended action: <b>'+action+'</b></p><h3>Skill breakdown</h3>'+Object.entries(skills).map(([k,v])=>'<p>'+k+': '+Math.round(v.correct/v.total*100)+'%</p>').join('')+(weak?'<div class="card"><b>Priority area:</b> '+weak[0]+'</div>':'')+'<button onclick="topic(\''+a.topic+'\')">Return to Topic</button>'+(score<80?'<button onclick="assessment(\''+a.topic+'\',true)">Reassess</button>':'<button onclick="dashboard()">Continue</button>')+'</div>'}
function finish(id){state.done[id]=true;save();topic(id.split('.')[0])}
dashboard();renderStudentAssignments();ITCoachRenderAnalytics('analyticsPanel');ITCoachRenderSkillAnalytics(1,'skillPanel');renderRemediationPanel(1);ITCoachRenderLearningPath(1,'learningPathPanel');ITCoachRenderCoach(1,'coachPanel');ITCoachRenderTutor(1,'Hardware, memory and storage','tutorPanel');ITCoachRenderGrowth('growthPanel');if(typeof ITCoachStudentReport==='function'){const sr=ITCoachStudentReport(1);document.getElementById('studentReportPanel').innerHTML='<div class="card"><h2>My Learning Report</h2><p><b>Latest score:</b> '+(sr.latest===null?'Not assessed':sr.latest+'%')+' &nbsp; <b>Growth:</b> '+(sr.growth===null?'—':(sr.growth>=0?'+':'')+sr.growth+' points')+'</p><p><b>Priority:</b> '+(sr.weaknesses[0]?sr.weaknesses[0].name:'No recorded weak skill')+'</p></div>';}

})();

function showLessonContent(id){const d=ITCoachGetLessonContent(id);const e=document.getElementById('lessonContent');if(d&&e)e.innerHTML='<div class="card"><h3>Key learning points</h3><ul>'+d.points.map(x=>'<li>'+x+'</li>').join('')+'</ul><p><b>Activity:</b> '+d.activity+'</p></div>';}
function showWorkspace(topicNo){const d=ITCoachGetWorkspace(topicNo);if(!d){alert('No practical workspace is mapped to this topic yet.');return;}app.innerHTML='<div class="card"><div class="small">Practical Learning</div><h1>'+d.name+'</h1><p>This browser-only workspace is a learning simulation.</p>'+d.tasks.map((x,i)=>'<div class="card"><b>Task '+(i+1)+'</b><p>'+x+'</p><textarea style="width:100%;min-height:70px;border:1px solid #ccd5e1;border-radius:8px" placeholder="Enter your response..."></textarea></div>').join('')+'<button onclick="topic(\\''+topicNo+'\\')">Return to Topic</button></div>';}
function showAssignments(){const a=ITCoachAssignments();app.innerHTML='<div class="card"><h1>Assignments & Progress</h1><p class="small">Browser-only prototype assignment records.</p><button onclick="createDemoAssignment()">+ Create Topic 1 Assignment</button>'+(!a.length?'<p>No assignments yet.</p>':a.map(x=>'<div class="card"><b>'+x.title+'</b><p>Topic '+x.topic+' • '+(x.dueDate||'No due date')+'</p><p>Status: <span class="pill">'+ITCoachAssignmentStatus(x.topic)+'</span></p></div>').join(''))+'<button class="secondary" onclick="ITCoachRenderTeacherDashboard()">Back to Teacher Dashboard</button></div>';}
function createDemoAssignment(){ITCoachCreateAssignment("1","Topic 1 Diagnostic Assessment");showAssignments();}
</script></body></html>
