<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Coach — Student Runtime</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f7fb;color:#172033}
header{background:#172033;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:18px}
.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:10px;padding:11px 14px;margin:5px 3px;background:#1f6feb;color:white;cursor:pointer}
button.secondary{background:#e8eef7;color:#172033}
.option{display:block;width:100%;text-align:left;background:#eef4ff;color:#172033;margin:8px 0}
.progress{height:10px;background:#e4e9f0;border-radius:10px;overflow:hidden}.bar{height:100%;background:#1f6feb}
.small{color:#667085;font-size:.92rem}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f7;margin:3px}
</style>
</head>
<body>
<header><strong>IT Coach</strong><div class="small" style="color:#d7e2f0">Student Runtime • Browser-only prototype</div></header>
<main id="app"></main>
<script>
const lessons=[
{id:'1.1',t:'Information technology and types of computer systems',o:['Understand information technology and types of computer systems']},
{id:'1.2',t:'Computer hardware, memory and storage',o:['Identify major hardware, memory and storage concepts']},
{id:'1.3',t:'Input and output devices',o:['Recognise input and output functions']},
{id:'1.4',t:'Software and user interfaces',o:['Distinguish software and user-interface concepts']},
{id:'1.5',t:'Information processing',o:['Describe information processing using the computer system']},
{id:'1.6',t:'Computer performance and troubleshooting',o:['Apply basic performance and troubleshooting concepts']},
{id:'1.7',t:'Enrichment: number systems and codes',o:['Practise number-system and coding concepts']}
];
const state=JSON.parse(localStorage.itcoachRuntime||'{}');
state.done=state.done||{};state.scores=state.scores||{};
let current=null;
function save(){localStorage.itcoachRuntime=JSON.stringify(state)}
function home(){
app.innerHTML='<div class="card"><h1>Student Dashboard</h1><p>Core learning cycle: Learn → Practice → Assess → Diagnose → Remediate → Reassess → Master.</p><div class="progress"><div class="bar" style="width:'+Math.round(Object.keys(state.done).length/lessons.length*100)+'%"></div></div><p class="small">'+Object.keys(state.done).length+' of '+lessons.length+' Topic 1 lessons completed</p></div>'+
'<div class="card"><h2>Topic 1 — Fundamentals of IT</h2>'+lessons.map((l,i)=>'<button class="option" onclick="lesson('+i+')">'+(state.done[l.id]?'✓ ':'')+l.id+' '+l.t+'</button>').join('')+'</div>';
}
function lesson(i){
current=lessons[i];
app.innerHTML='<div class="card"><div class="small">Topic 1 / Lesson '+current.id+'</div><h1>'+current.t+'</h1><h3>Objectives</h3><ul>'+current.o.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
'<div class="card"><h3>Learn</h3><p>This lesson is loaded through the reusable IT Coach student runtime. Approved workbook content blocks will populate this area as the source-reviewed content is connected.</p><span class="pill">Source-reviewed content layer</span><span class="pill">Interactive runtime</span></div>'+
'<button onclick="check()">Knowledge Check</button><button class="secondary" onclick="home()">Back to lessons</button></div>';
}
function check(){
app.innerHTML='<div class="card"><div class="small">Knowledge Check</div><h2>Which stage should come after learning in the IT Coach learning cycle?</h2><button class="option" onclick="answer(false)">Stop studying</button><button class="option" onclick="answer(true)">Practice</button><button class="option" onclick="answer(false)">Skip assessment</button><div id="feedback"></div></div>';
}
function answer(ok){
feedback.innerHTML='<div class="card"><strong>'+(ok?'Correct.':'Review this sequence.')+'</strong><p>The prototype learning cycle is Learn → Practice → Assess → Diagnose → Remediate → Reassess → Master.</p><button onclick="complete()">Continue to Practice</button></div>';
}
function complete(){state.done[current.id]=true;save();home()}
home();
</script>
</body>
</html>
