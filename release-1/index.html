<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>IT Coach 1.0 — Core Learning Engine</title>
<style>
:root{--p:#0f766e;--pd:#115e59;--bg:#f6f8fa;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--good:#15803d;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:820px;margin:auto;padding:0 14px 80px}.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;padding:12px 14px;margin:0 -14px 14px;display:flex;align-items:center;gap:10px}.bar h1{font-size:16px;margin:0;flex:1}.bar button{border:0;border-radius:9px;padding:7px 10px;background:#ffffff22;color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0000000b}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.btn{border:0;border-radius:10px;background:var(--p);color:#fff;padding:10px 14px;font-weight:700}.btn.secondary{background:#e2e8f0;color:var(--text)}.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--p)}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#ccfbf1;color:var(--pd);font-size:12px;font-weight:700}.muted{color:var(--muted);font-size:13px}.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:16px;padding:20px}.hero h2{margin:0 0 6px}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--p)}.lesson{padding:14px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.lesson.done{border-color:#86efac;background:#f0fdf4}.opt{display:block;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.opt input{margin-right:8px}.feedback{padding:10px;border-radius:10px;margin-top:10px}.good{background:#f0fdf4;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e40af}.diagram{border:1px dashed #94a3b8;border-radius:12px;padding:14px;text-align:center;background:#f8fafc;margin:10px 0}.flow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.box{padding:10px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);font-weight:700}.arrow{font-size:20px;color:var(--p)}.stat{font-size:24px;font-weight:800;color:var(--p)}.navgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:600px){.navgrid{grid-template-columns:repeat(4,1fr)}}.hide{display:none!important}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:13px}
</style>
</head>
<body><main id="app" class="wrap"></main>
<script>
const TOPIC={id:1,title:"Fundamentals of IT",icon:"🖥️",lessons:[
{id:"1.1",title:"The computer system and primary storage",objectives:["Describe the IPOS cycle and the functions of CPU components","Distinguish RAM, ROM, PROM and EPROM and state storage units","Classify computers by size and describe instruction processing"],blocks:[
["diagram","IPOS Cycle",["INPUT","PROCESSING","OUTPUT","STORAGE"]],
["p","A computer system follows the IPOS cycle: Input, Processing, Output and Storage. Hardware is the physical equipment; software is the programs. Data is raw, unprocessed facts; information is processed data that has meaning."],
["h","CPU components"],["p","The CPU includes the Control Unit, Arithmetic and Logic Unit (ALU), and registers. The Control Unit coordinates activities and the fetch-decode-execute cycle. The ALU performs arithmetic and logical operations. Registers are very fast small storage areas."],
["diagram","CPU",["CONTROL UNIT","ALU","REGISTERS"]],
["table","Memory",["RAM|Volatile; programs and data currently in use","ROM|Non-volatile; start-up instructions","PROM|Programmed once","EPROM|Can be erased and reprogrammed"]],
["callout","Storage units: 1 byte = 8 bits; 1 KB = 1024 bytes; 1 MB = 1024 KB; 1 GB = 1024 MB; 1 TB = 1024 GB."]
],checks:[["Name the four basic functions of a computer system.","Input, Processing, Output and Storage (IPOS)."],["State two differences between RAM and ROM.","RAM is volatile while ROM is non-volatile; RAM holds programs/data in use while ROM holds start-up instructions."],["How many bits are in 2 KB?","16,384 bits."]]},
{id:"1.2",title:"Input, output and secondary storage devices",objectives:["Identify input and output devices and their applications","Compare printers and other output devices","Compare secondary storage by access method, capacity and speed"],blocks:[
["h","Input devices"],["table","Examples",["Keyboard / mouse / touchscreen|Manual entry and commands","Scanner / camera / webcam|Capture images and video","Barcode reader / POS|Read product codes","OMR|Read marked responses","OCR|Read printed or typed characters","MICR|Read magnetic ink on cheques","Sensors|Automatic input for control systems"]],
["h","Printers"],["table","Comparison",["Dot matrix|Noisy, slower, useful for carbon copies","Inkjet|Good colour and low purchase cost","Laser|Fast, quiet and high print quality"]],
["h","Secondary storage"],["table","Access",["Magnetic tape|Sequential access; useful for backups","Hard disk|Direct access; high capacity","CD/DVD|Laser-based optical storage","Flash drive|Portable, direct access, no moving parts"]]
],checks:[["Which device is used by banks to read characters on cheques?","MICR."],["Why is magnetic tape unsuitable when one record must be found quickly?","It uses sequential access, so earlier records must be passed before the required record is reached."],["State two advantages of a laser printer over a dot matrix printer.","It is faster, quieter and provides higher print quality."]]},
{id:"1.3",title:"Data representation and number systems",objectives:["Convert between binary and decimal and understand hexadecimal","Add binary numbers and understand negative representation","Explain character coding"],blocks:[
["diagram","Binary place values",["128","64","32","16","8","4","2","1"]],
["p","Binary is base 2. Each position represents a power of 2. For example, 00001101 = 8 + 4 + 1 = 13."],
["p","Hexadecimal is base 16 and uses 0–9 and A–F. Binary can be grouped in fours when converting to hexadecimal."],
["callout","Two's complement is a method for representing negative binary numbers. For -5 in 8 bits: 00000101 → invert → 11111010 → add 1 → 11111011."]
],checks:[["Convert 110101 to decimal.","53."],["Convert decimal 100 to binary.","1100100."],["Add 1101 and 1011.","11000."]]},
{id:"1.4",title:"Software and user interfaces",objectives:["Distinguish system and application software","Describe operating-system functions","Compare user interfaces"],blocks:[
["p","System software controls and manages the computer. Application software performs tasks for the user."],
["table","Operating system functions",["Process and memory management|Controls programs and memory use","File management|Organises files and folders","Device management|Controls hardware through drivers","Security|Accounts, permissions and passwords","User interface|Provides a way for users to interact"]],
["p","Utilities perform maintenance tasks such as antivirus scanning, compression and software removal. Interfaces may include GUI, command-line and menu-driven interfaces."]
],checks:[["Give one example of system software and one application.","An operating system such as Windows is system software; a word processor is application software."],["State three functions of an operating system.","Any three: process management, memory management, file management, device management, security or user interface."],["State one advantage of custom-written software.","It can be designed to meet a client's specific requirements."]]},
{id:"1.5",title:"Information processing",objectives:["Distinguish data from information","Explain validation and verification","Describe processing modes"],blocks:[
["p","Data consists of raw facts. Information is data that has been processed into a meaningful form."],
["table","Validation checks",["Range|Rejects values outside limits","Data type|Checks the kind of data entered","Length|Checks number of characters","Presence|Checks that a required field is not blank","Format|Checks a required pattern","Check digit|Helps detect transcription errors"]],
["p","Verification checks whether data was copied or entered accurately. Batch processing groups transactions for later processing; real-time processing produces an immediate response."]
],checks:[["Which validation check rejects a score of 105 out of 100?","A range check."],["What is verification?","Checking that data was copied or entered accurately."],["Why is payroll suited to batch processing?","Transactions can be collected over a period and processed together without immediate user interaction."]]}
]};

const Q=[
["Which part of the CPU performs arithmetic and logical operations?",["ALU","Control Unit","ROM","Cache"],0],
["Which memory is volatile?",["ROM","RAM","PROM","EPROM"],1],
["Which access method is used by magnetic tape?",["Direct","Random","Sequential","Parallel"],2],
["Which validation check rejects an impossible value such as 105 out of 100?",["Range","Length","Presence","Format"],0],
["What does IPOS stand for?",["Input, Processing, Output, Storage","Input, Program, Output, Security","Information, Processing, Output, Storage","Input, Processing, Online, Storage"],0]
];

const KEY="itcoach_1_0_release1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{view:"home",student:"",done:{},checks:{},practice:null,assessment:null};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]||c))}
function set(html){document.getElementById("app").innerHTML=html;window.scrollTo(0,0)}
function header(title,back="home"){return '<header class="bar"><button onclick="go(\''+back+'\')">← Back</button><h1>'+esc(title)+'</h1><button onclick="go(\'home\')">Home</button></header>'}
function go(v,arg){state.view=v;state.arg=arg;save();render()}
function render(){if(state.view==="home")home();else if(state.view==="topic")topic();else if(state.view==="lesson")lesson();else if(state.view==="practice")practice();else if(state.view==="assessment")assessment();else if(state.view==="progress")progress();else render()}
function home(){
 const done=TOPIC.lessons.filter(l=>state.done[l.id]).length,pct=Math.round(done/TOPIC.lessons.length*100);
 set(header("IT Coach 1.0 — Core Learning Engine","home")+
 '<section class="hero"><h2>Learn → Practice → Assess → Diagnose → Remediate → Reassess → Master</h2><p>Reference implementation: CSEC Information Technology · Topic 1</p><p><b>Student:</b> '+esc(state.student||"Not set")+'</p></section>'+
 '<div class="card"><label><b>Student name</b></label><div class="grid two" style="margin-top:8px"><input id="name" value="'+esc(state.student)+'" placeholder="Enter your name"><button class="btn" onclick="setName()">Save profile</button></div></div>'+
 '<div class="card"><div class="grid two"><div><div class="stat">'+pct+'%</div><div class="muted">Topic mastery</div></div><div><div class="stat">'+done+'/'+TOPIC.lessons.length+'</div><div class="muted">Lessons completed</div></div></div><div class="progress" style="margin-top:12px"><i style="width:'+pct+'%"></i></div></div>'+
 '<div class="card"><h2>'+TOPIC.icon+' '+TOPIC.title+'</h2><p class="muted">Start with the lessons, then use practice and assessment to identify what needs revision.</p><button class="btn" onclick="go(\'topic\')">Open Topic 1</button></div>'+
 '<div class="card"><h2>Learning cycle</h2><div class="navgrid"><button class="btn ghost" onclick="go(\'topic\')">📘 Learn</button><button class="btn ghost" onclick="go(\'practice\')">🎯 Practice</button><button class="btn ghost" onclick="go(\'assessment\')">📝 Assess</button><button class="btn ghost" onclick="go(\'progress\')">📊 Diagnose</button></div></div>');
}
function topic(){
 const done=TOPIC.lessons.filter(l=>state.done[l.id]).length;
 set(header(TOPIC.icon+" "+TOPIC.title)+
 '<div class="card"><span class="pill">Reference implementation</span><h2>Topic 1 learning path</h2><p class="muted">Complete lessons in order or revisit any lesson. Your completion is stored in this browser.</p><div class="progress"><i style="width:'+Math.round(done/TOPIC.lessons.length*100)+'%"></i></div></div>'+
 TOPIC.lessons.map(l=>'<div class="lesson '+(state.done[l.id]?"done":"")+'"><div class="row"><b style="flex:1">'+l.id+' · '+esc(l.title)+'</b><span class="pill">'+(state.done[l.id]?"Complete":"Lesson")+'</span></div><p class="muted">'+l.objectives[0]+'</p><button class="btn small" onclick="openLesson(\''+l.id+'\')">'+(state.done[l.id]?"Review":"Start")+'</button></div>').join("")+
 '<div class="card"><h2>Next stage</h2><div class="grid two"><button class="btn" onclick="go(\'practice\')">Start Practice</button><button class="btn secondary" onclick="go(\'assessment\')">Take Assessment</button></div></div>');
}
function renderBlock(b){
 if(b[0]==="p")return '<p>'+esc(b[1])+'</p>';
 if(b[0]==="h")return '<h3>'+esc(b[1])+'</h3>';
 if(b[0]==="callout")return '<div class="feedback info">💡 '+esc(b[1])+'</div>';
 if(b[0]==="diagram")return '<div class="diagram"><b>'+esc(b[1])+'</b><div class="flow">'+b[2].map((x,i)=>'<span class="box">'+esc(x)+'</span>'+(i<b[2].length-1?'<span class="arrow">→</span>':'')).join("")+'</div></div>';
 if(b[0]==="table"){let rows=b[2].map(x=>x.split("|"));return '<h3>'+esc(b[1])+'</h3><div style="overflow:auto"><table><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1]||"")+'</td></tr>').join("")+'</tbody></table></div>'}
 return "";
}
function openLesson(id){state.arg=id;state.view="lesson";save();render()}
function lesson(){
 const l=TOPIC.lessons.find(x=>x.id===state.arg)||TOPIC.lessons[0];
 set(header(l.id+" · "+l.title,"topic")+
 '<div class="card"><span class="pill">Objectives</span><ul>'+l.objectives.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>'+
 l.blocks.map(renderBlock).join("")+
 '<div class="card"><h2>Knowledge check</h2><p class="muted">Reveal the model answer after thinking about each question.</p>'+l.checks.map((q,i)=>'<div class="lesson"><b>Q'+(i+1)+'. '+esc(q[0])+'</b><br><button class="btn ghost small" style="margin-top:8px" onclick="reveal(\''+l.id+'-'+i+'\')">Reveal answer</button><div id="a-'+l.id+'-'+i+'" class="hide feedback info"><b>Model answer:</b> '+esc(q[1])+'</div></div>').join("")+'</div>'+
 '<div class="card"><button class="btn" style="width:100%" onclick="complete(\''+l.id+'\')">'+(state.done[l.id]?"✓ Lesson completed — mark again":"Mark lesson complete")+'</button></div>');
}
function reveal(id){document.getElementById("a-"+id).classList.remove("hide")}
function complete(id){state.done[id]=true;save();go("lesson",id)}
function setName(){state.student=document.getElementById("name").value.trim()||"Student";save();render()}
function practice(){
 const q=Q[Math.floor(Math.random()*Q.length)];
 state.practice=q;
 set(header("Practice — adaptive question","topic")+
 '<div class="card"><span class="pill">Practice</span><h2>'+esc(q[0])+'</h2>'+q[1].map((o,i)=>'<label class="opt"><input type="radio" name="pq" value="'+i+'">'+esc(o)+'</label>').join("")+
 '<button class="btn" onclick="checkPractice()">Check answer</button><div id="pf"></div></div>'+
 '<div class="card"><h2>Adaptive rule</h2><p class="muted">Correct answers move you forward. Incorrect answers should trigger revision of the related lesson before reassessment.</p></div>');
}
function checkPractice(){let el=document.querySelector('input[name="pq"]:checked'),f=document.getElementById("pf");if(!el){f.innerHTML='<div class="feedback info">Choose an answer first.</div>';return}let ok=+el.value===state.practice[2];state.checks.practice=ok;save();f.innerHTML=ok?'<div class="feedback good">✓ Correct. Try another practice question or move to the assessment.</div>':'<div class="feedback bad">✗ Review Topic 1 lessons, then try another question.</div>'}
function assessment(){
 if(!state.assessment)state.assessment={items:[...Q].sort(()=>Math.random()-.5),answers:{}};
 let a=state.assessment;
 set(header("Topic 1 Assessment","topic")+
 '<div class="card"><span class="pill">Assessment</span><h2>5-question Topic 1 check</h2><p class="muted">Select one answer for each question, then submit once.</p></div>'+
 a.items.map((q,i)=>'<div class="card"><b>Q'+(i+1)+'. '+esc(q[0])+'</b>'+q[1].map((o,j)=>'<label class="opt"><input type="radio" name="aq'+i+'" value="'+j+'">'+esc(o)+'</label>').join("")+'</div>').join("")+
 '<div class="card"><button class="btn" style="width:100%" onclick="submitAssessment()">Submit assessment</button></div>');
}
function submitAssessment(){let a=state.assessment,score=0,answered=0;a.items.forEach((q,i)=>{let e=document.querySelector('input[name="aq'+i+'"]:checked');if(e){answered++;a.answers[i]=+e.value;if(+e.value===q[2])score++}});if(answered<a.items.length){alert("Please answer all 5 questions.");return}a.score=score;a.pct=Math.round(score/a.items.length*100);a.at=Date.now();state.assessment=a;save();go("progress")}
function progress(){
 let done=TOPIC.lessons.filter(l=>state.done[l.id]).length,lessonPct=Math.round(done/TOPIC.lessons.length*100),ass=state.assessment;
 let mastery=ass?Math.max(lessonPct,ass.pct):lessonPct;
 let rec=mastery<70?"Remediate: revisit the lessons and repeat Practice.":mastery<80?"Practice: focus on the knowledge checks before reassessment.":"Consolidate: repeat the assessment later to confirm mastery.";
 set(header("Progress & Diagnosis","home")+
 '<div class="card"><div class="grid two"><div><div class="stat">'+mastery+'%</div><div class="muted">Current mastery</div></div><div><div class="stat">'+done+'/'+TOPIC.lessons.length+'</div><div class="muted">Lessons complete</div></div></div><div class="progress" style="margin-top:12px"><i style="width:'+mastery+'%"></i></div></div>'+
 '<div class="card"><h2>Diagnosis</h2><div class="feedback '+(mastery<70?"bad":mastery<80?"info":"good")+'">'+rec+'</div></div>'+
 '<div class="card"><h2>Assessment result</h2>'+(ass?'<p><b>'+ass.score+'/'+ass.items.length+'</b> · '+ass.pct+'% · '+new Date(ass.at).toLocaleString()+'</p>':'<p class="muted">No assessment completed yet.</p>')+'</div>'+
 '<div class="card"><h2>Next action</h2><div class="grid two"><button class="btn" onclick="go(\'practice\')">Practice again</button><button class="btn secondary" onclick="go(\'assessment\')">Reassess</button></div></div>');
}
render();
</script></body></html>
